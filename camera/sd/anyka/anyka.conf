# Configuración de los servicios locales de la cámara.
# Se lee con `. /mnt/anyka/anyka.conf` desde start.sh y desde la API de control.

# Vídeo (libre_anyka_app): vs0 es siempre 1280x720; estos valores son de vs1.
VIDEO_SUB_WIDTH=640
VIDEO_SUB_HEIGHT=360
# Opciones de libre_anyka_app: -i 1..4 = inversión día/noche e IR (ver README), -u = girar 180°.
# Con -i 4 esta cámara da imagen en gris a plena luz; -i 1 = sin inversiones.
VIDEO_ARGS="-i 1 -u"

# Puerto TCP que recibe audio G.711 A-law 8 kHz mono para el altavoz.
TALK_PORT=10000

# Puerto HTTP de la API de control.
CTL_PORT=8080

# IP autorizada para la API de control (la de Home Assistant / go2rtc).
# Vacío = cualquier equipo de la red local.
CTL_ALLOW_IP=192.168.68.250

# Homing de los motores al arrancar (necesario antes de mover).
PTZ_HOME_ON_BOOT=1
